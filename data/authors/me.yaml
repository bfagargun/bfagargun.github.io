bio: |
  Gastroenterology and hepatology fellow at Istanbul University, Istanbul Faculty of Medicine.
  My clinical work centres on inflammatory bowel disease and diagnostic and therapeutic endoscopy;
  my research combines real-world cohorts with natural-language processing and AI-assisted analytics —
  including an NLP programme over more than 11,000 colonoscopy reports and the ELASTIBD transient
  elastography study of liver fibrosis and steatosis in IBD. I am also a PhD candidate in clinical trials.

