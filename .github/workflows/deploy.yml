name: Deploy website to GitHub Pages

# The site is plain HTML: nothing is built here, the files are published as they are.
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect site files (data/ and tools/ stay in the repo only)
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site \
              --exclude=./data --exclude=./tools --exclude=./README.md --exclude=./.gitignore -cf - . | tar -xf - -C _site
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
